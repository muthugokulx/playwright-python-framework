[pytest]
testpaths = tests
base_url = https://www.saucedemo.com
addopts =
    -v
    --browser chromium
    --screenshot only-on-failure
    --video retain-on-failure
    --output reports/artifacts
    --html reports/report.html
    --self-contained-html
markers =
    smoke: quick critical-path checks
    regression: full regression suite
